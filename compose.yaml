services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  sensors:
    build:
      context: ./src
      dockerfile: sensors/Dockerfile
    container_name: sensors
    restart: unless-stopped
    env_file: .env
    devices:
      - ${GPIOCHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip0
    volumes:
      - mode-state:/run/moos
      - ./config:/config:ro
    depends_on:
      - influxdb

  dashboard:
    build:
      context: ./src
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      - mode-state:/run/moos
      - ./config:/config:ro
    ports:
      - "8080:8080"
    depends_on:
      - influxdb
      - camera
    devices:
      - ${GPIOCHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip0

  camera:
    build: ./src/camera
    container_name: camera
    restart: unless-stopped
    privileged: true
    environment:
      KAMERA_PORT: 8000
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro

volumes:
  influxdb-data:
  influxdb-config:
  mode-state:
