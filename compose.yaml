services:
  ingest:
    build: ./src/ingest
    restart: unless-stopped
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - ${GPIOCHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip0
    volumes:
      - /proc/device-tree:/proc/device-tree:ro

  influxdb:
    image: influxdb:2.7.11
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Set INFLUXDB_ADMIN_TOKEN in .env}
    volumes:
      - ./src/visualisation/influxdb/data:/var/lib/influxdb2
      - ./src/visualisation/influxdb/config:/etc/influxdb2

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    user: ${GRAFANA_UID:-1000}:${GRAFANA_GID:-1000}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./src/visualisation/grafana/data:/var/lib/grafana
      - ./src/visualisation/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
