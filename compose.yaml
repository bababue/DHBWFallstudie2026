services:
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./src/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

  ingest:
    build: ./src/ingest
    container_name: ingest
    restart: unless-stopped
    env_file: .env
    devices:
      - ${GPIOCHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip0
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
